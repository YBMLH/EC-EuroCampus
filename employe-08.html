  <style>
    /* =========================================================
       EURO CAMPUS — brand tokens (teal #1EA9BA from their site)
       ========================================================= */
    :root {
      --teal:        #1EA9BA;
      --teal-deep:   #157f8c;
      --teal-dark:   #0e5c66;
      --teal-light:  #5ec7d4;
      --teal-pale:   #e6f6f8;
      --ink:         #0d2c30;
      --white:       #ffffff;
      --off:         #f3f9fa;
      --muted:       #5d7a7e;
      --border:      rgba(30, 169, 186, 0.14);
      --card-r:      22px;
      --sh-sm: 0 2px 12px rgba(14, 92, 102, 0.08);
      --sh-md: 0 8px 30px rgba(14, 92, 102, 0.14);
      --sh-lg: 0 22px 60px rgba(14, 92, 102, 0.22);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Manrope', sans-serif;
      background: var(--off);
      color: var(--ink);
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Atmospheric world-map style background (matches their banner) */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 50% at 50% -8%, rgba(30,169,186,.22) 0%, transparent 68%),
        radial-gradient(ellipse 60% 45% at 95% 100%, rgba(94,199,212,.14) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 22px 16px 56px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .page > * { animation: rise .55s cubic-bezier(.22,.68,0,1.2) both; }
    .page > *:nth-child(1){animation-delay:.04s}
    .page > *:nth-child(2){animation-delay:.10s}
    .page > *:nth-child(3){animation-delay:.16s}
    .page > *:nth-child(4){animation-delay:.22s}
    .page > *:nth-child(5){animation-delay:.28s}
    .page > *:nth-child(6){animation-delay:.34s}
    .page > *:nth-child(7){animation-delay:.40s}
    .page > *:nth-child(8){animation-delay:.46s}
    @keyframes rise { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

    /* ── Brand bar ── */
    .brand-bar {
      display:flex; align-items:center; justify-content:space-between;
      padding: 13px 18px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--sh-sm);
    }
    .logo { display:flex; align-items:center; gap:10px; }
    .logo-mark {
      width: 40px; height: 40px;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0;
    }
    .logo-mark svg { width:40px; height:40px; }
    .logo-text { line-height:1; }
    .logo-text .ec {
      font-family:'Manrope',sans-serif; font-weight:800;
      font-size:1.05rem; color:var(--teal); letter-spacing:.02em;
    }
    .logo-text .tag {
      display:block; font-size:.6rem; font-weight:600; color:var(--muted);
      letter-spacing:.14em; text-transform:uppercase; margin-top:2px;
    }
    .nfc-badge {
      display:flex; align-items:center; gap:5px;
      background:var(--teal-pale); border:1px solid var(--border);
      border-radius:100px; padding:5px 11px;
      font-size:.68rem; font-weight:700; color:var(--teal-deep);
      letter-spacing:.08em; text-transform:uppercase;
    }
    .nfc-badge svg{ width:13px;height:13px;fill:var(--teal-deep); }

    /* ── Hero ── */
    .hero {
      position:relative; overflow:hidden;
      background: linear-gradient(140deg, var(--teal) 0%, var(--teal-deep) 60%, var(--teal-dark) 100%);
      border-radius: var(--card-r);
      padding: 34px 26px 30px;
      box-shadow: var(--sh-lg);
    }
    .hero::before {
      content:''; position:absolute; top:-50px; right:-50px;
      width:220px; height:220px;
      background: radial-gradient(circle, rgba(255,255,255,.16) 0%, transparent 70%);
      border-radius:50%;
    }
    .hero::after {
      content:''; position:absolute; bottom:-70px; left:-40px;
      width:260px; height:180px;
      background: radial-gradient(ellipse, rgba(255,255,255,.07) 0%, transparent 70%);
      border-radius:50%;
    }
    .avatar {
      width:78px; height:78px; border-radius:22px;
      background: rgba(255,255,255,.16);
      border: 2px solid rgba(255,255,255,.4);
      backdrop-filter: blur(4px);
      display:flex; align-items:center; justify-content:center;
      font-family:'Manrope',sans-serif; font-weight:800; font-size:1.7rem;
      color:#fff; margin-bottom:16px;
      position:relative; z-index:1;
    }
    .person-name {
      font-family:'Poppins',sans-serif; font-weight:700;
      font-size:1.7rem; color:#fff; line-height:1.18;
      position:relative; z-index:1;
    }
    .person-role {
      font-size:.95rem; font-weight:500; color:rgba(255,255,255,.9);
      margin-top:5px; position:relative; z-index:1;
    }
    .person-dept {
      display:inline-block; margin-top:13px;
      background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.28);
      border-radius:100px; padding:4px 14px;
      font-size:.72rem; font-weight:700; color:#fff;
      letter-spacing:.07em; text-transform:uppercase;
      position:relative; z-index:1;
    }

    /* ── Location ── */
    .loc {
      display:flex; align-items:center; gap:12px;
      background:var(--white); border:1px solid var(--border);
      border-radius:15px; padding:13px 16px;
      text-decoration:none; color:var(--ink);
      box-shadow:var(--sh-sm);
      transition:box-shadow .2s, transform .2s;
    }
    .loc:hover{ box-shadow:var(--sh-md); transform:translateY(-2px); }
    .loc-ic {
      width:40px;height:40px;flex-shrink:0;
      background:linear-gradient(135deg,var(--teal),var(--teal-light));
      border-radius:12px; display:flex; align-items:center; justify-content:center;
    }
    .loc-ic svg{ width:19px;height:19px;fill:#fff; }
    .loc-t{ flex:1; }
    .loc-l{ font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase; }
    .loc-v{ font-size:.92rem;font-weight:600;color:var(--ink);margin-top:2px; }
    .loc-arrow svg{ width:16px;height:16px;fill:var(--teal); }

    /* ── Section label ── */
    .label {
      font-size:.7rem; font-weight:800; color:var(--muted);
      letter-spacing:.12em; text-transform:uppercase;
      padding:0 4px; margin-bottom:-3px;
    }

    /* ── Contact grid ── */
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .btn {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:7px; padding:17px 10px; border-radius:15px;
      text-decoration:none; font-size:.84rem; font-weight:700;
      transition:transform .18s, box-shadow .18s; border:none; cursor:pointer;
    }
    .btn:hover{ transform:translateY(-3px); box-shadow:var(--sh-md); }
    .btn:active{ transform:scale(.96); }
    .btn svg{ width:24px;height:24px; }
    .b-call { background:var(--teal); color:#fff; box-shadow:0 4px 14px rgba(30,169,186,.3); }
    .b-mail { background:var(--white); color:var(--ink); border:1px solid var(--border); }
    .b-wa   { background:#25d366; color:#fff; box-shadow:0 4px 14px rgba(37,211,102,.25); }
    .b-li   { background:#0a66c2; color:#fff; box-shadow:0 4px 14px rgba(10,102,194,.25); }

    /* ── Save CTA ── */
    .save {
      display:flex; align-items:center; justify-content:center; gap:10px;
      background:linear-gradient(90deg,var(--teal) 0%,var(--teal-deep) 100%);
      color:#fff; font-size:.96rem; font-weight:700; padding:18px;
      border-radius:15px; text-decoration:none;
      box-shadow:0 6px 22px rgba(30,169,186,.36);
      transition:transform .18s, box-shadow .18s; letter-spacing:.01em;
    }
    .save:hover{ transform:translateY(-3px); box-shadow:0 10px 30px rgba(30,169,186,.46); }
    .save svg{ width:22px;height:22px;fill:#fff; }

    /* ── Social ── */
    .social { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
    .s-btn {
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
      padding:13px 6px; background:var(--white); border:1px solid var(--border);
      border-radius:13px; font-size:.72rem; font-weight:600; color:var(--ink);
      text-decoration:none; transition:background .15s, transform .15s;
    }
    .s-btn:hover{ background:var(--teal-pale); transform:translateY(-2px); }
    .s-btn svg{ width:20px;height:20px; }

    .divider{ height:1px; background:var(--border); border-radius:1px; }
    .footer{ text-align:center; padding-top:6px; font-size:.72rem; color:var(--muted); }
    .footer a{ color:var(--teal-deep); text-decoration:none; font-weight:700; }
  </style>
</head>
