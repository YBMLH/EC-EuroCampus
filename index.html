<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Euro Campus — Répertoire des cartes NFC</title>
  <meta name="theme-color" content="#1EA9BA"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --teal:#1EA9BA; --teal-deep:#157f8c; --teal-light:#5ec7d4;
      --ink:#0d2c30; --off:#f3f9fa; --muted:#5d7a7e; --border:rgba(30,169,186,.14); --white:#fff;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Manrope',sans-serif;background:var(--off);color:var(--ink)}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 90% 40% at 50% -5%,rgba(30,169,186,.18) 0%,transparent 66%);pointer-events:none}
    .wrap{max-width:780px;margin:0 auto;padding:36px 18px 80px;position:relative}
    header{text-align:center;margin-bottom:34px}
    .logo-mark{display:inline-flex;margin-bottom:10px}
    .logo-mark svg{width:60px;height:60px}
    .title{font-family:'Poppins',sans-serif;font-weight:700;font-size:1.7rem;color:var(--teal)}
    .sub{font-size:.9rem;color:var(--muted);margin-top:4px}
    .badge{display:inline-block;margin-top:12px;background:var(--teal);color:#fff;border-radius:100px;padding:5px 16px;font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:13px}
    .card{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:20px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:7px;box-shadow:0 2px 10px rgba(14,92,102,.06);transition:box-shadow .2s,transform .2s}
    .card:hover{box-shadow:0 10px 28px rgba(14,92,102,.14);transform:translateY(-3px)}
    .av{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--teal),var(--teal-light));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
    .cn{font-weight:700;font-size:.96rem}
    .cr{font-size:.78rem;color:var(--muted)}
    .city{font-size:.7rem;font-weight:700;color:var(--teal-deep);background:rgba(30,169,186,.08);border-radius:7px;padding:3px 9px;display:inline-block;margin-top:3px;width:fit-content}
    .uses{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.69rem;font-weight:700;color:var(--teal-deep);margin-top:6px;padding-top:8px;border-top:1px solid var(--border)}
    .uses .u-rate,.uses .u-last{color:var(--muted);font-weight:600}
    .uses-sub{font-size:.64rem;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-top:3px}
    footer{text-align:center;margin-top:44px;font-size:.8rem;color:var(--muted)}
    .note{background:#fff8e6;border:1px solid #f0d98a;border-radius:12px;padding:14px 16px;font-size:.82rem;color:#7a5d00;margin-bottom:24px;line-height:1.5}
    .stats-link{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;margin-bottom:22px;border-radius:14px;text-decoration:none;background:linear-gradient(90deg,var(--teal),var(--teal-deep));color:#fff;font-weight:700;font-size:.95rem;box-shadow:0 6px 20px rgba(30,169,186,.3);transition:transform .18s,box-shadow .18s}
    .stats-link:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(30,169,186,.4)}
    .stats-link svg{width:20px;height:20px;fill:#fff}
  </style>
  <!-- EC enhancements -->
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/card.css" />
  <script>(function(){try{var t=localStorage.getItem('ec-theme')||((window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <script src="assets/gate.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo-mark">
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="4" y="14" width="26" height="6" rx="3" fill="#1EA9BA"/>
        <rect x="4" y="29" width="26" height="6" rx="3" fill="#1EA9BA"/>
        <rect x="4" y="44" width="26" height="6" rx="3" fill="#1EA9BA"/>
        <path d="M58 20a18 18 0 1 0 0 24" stroke="#1EA9BA" stroke-width="6" stroke-linecap="round" fill="none"/>
      </svg>
    </span>
    <div class="title">Euro Campus</div>
    <div class="sub">Répertoire interne des cartes NFC</div>
    <span class="badge">15 cartes actives</span>
  </header>

  <div class="note">
    🔒 Cette page est un panneau d'administration interne (liste des 15 cartes).
    Chaque carte a sa propre adresse à programmer sur la puce NFC.
  </div>

  <a class="stats-link" href="dashboard.html">
    <svg viewBox="0 0 24 24"><path d="M3 13h4v8H3v-8zm7-9h4v17h-4V4zm7 5h4v12h-4V9z"/></svg>
    Voir les statistiques des avis
  </a>

  <div class="grid" id="grid"></div>

  <footer>Euro Campus · Système de cartes NFC · 7 bureaux en Algérie</footer>
</div>

<script>
  // Mirror of employee data for the directory listing
  const people = [
    {slug:"employe-01",name:"Hakim Bennini",role:"Directeur Général",city:"Tizi Ouzou",av:"HB"},
    {slug:"employe-02",name:"Prénom Nom",role:"Directrice des Opérations",city:"Tizi Ouzou",av:"PN"},
    {slug:"employe-03",name:"Prénom Nom",role:"Conseiller en Orientation",city:"Tizi Ouzou",av:"PN"},
    {slug:"employe-04",name:"Prénom Nom",role:"Conseillère en Orientation",city:"Tizi Ouzou",av:"PN"},
    {slug:"employe-05",name:"Prénom Nom",role:"Responsable Admissions",city:"Tizi Ouzou",av:"PN"},
    {slug:"employe-06",name:"Prénom Nom",role:"Responsable Béjaïa",city:"Béjaïa",av:"PN"},
    {slug:"employe-07",name:"Prénom Nom",role:"Conseiller en Orientation",city:"Béjaïa",av:"PN"},
    {slug:"employe-08",name:"Prénom Nom",role:"Responsable Alger",city:"Alger",av:"PN"},
    {slug:"employe-09",name:"Prénom Nom",role:"Conseillère en Orientation",city:"Alger",av:"PN"},
    {slug:"employe-10",name:"Prénom Nom",role:"Responsable Oran",city:"Oran",av:"PN"},
    {slug:"employe-11",name:"Prénom Nom",role:"Conseiller en Orientation",city:"Oran",av:"PN"},
    {slug:"employe-12",name:"Prénom Nom",role:"Responsable Constantine",city:"Constantine",av:"PN"},
    {slug:"employe-13",name:"Prénom Nom",role:"Responsable Annaba",city:"Annaba",av:"PN"},
    {slug:"employe-14",name:"Prénom Nom",role:"Responsable Boumerdès",city:"Boumerdès",av:"PN"},
    {slug:"employe-15",name:"Prénom Nom",role:"Chargée Communication",city:"Tizi Ouzou",av:"PN"}
  ];
  // Same Apps Script Web App URL used for reviews/analytics (GET via JSONP).
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbxVrPv_7MOGORDnFOqsMUdyNVTzBb9ZRjLPsplg79prvc6qd6zBzwGEP01pf0olQ4v_/exec";
  const g = document.getElementById("grid");

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function initialsFrom(name){return (name||"").trim().split(/\s+/).map(w=>w[0]||"").slice(0,2).join("").toUpperCase();}
  // Map a Sheet "Employes" record onto the directory card shape.
  function fromEmployee(r){
    return {slug:r.slug, name:r.nom||"", role:r.poste||"", city:(r.bureau||"").split("—")[0].trim(),
            av:r.initiales||initialsFrom(r.nom)};
  }

  // ── JSONP loader (Apps Script sends no CORS headers) ──
  function jsonp(url, cb){
    var name="_ecdir_"+Math.random().toString(36).slice(2), s=document.createElement("script"), done=false;
    function finish(d){if(done)return;done=true;try{cb(d);}catch(e){}try{delete window[name];}catch(e){window[name]=undefined;}if(s.parentNode)s.parentNode.removeChild(s);}
    window[name]=function(d){finish(d);};
    s.src=url+(url.indexOf("?")<0?"?":"&")+"callback="+name+"&_="+Date.now();
    s.onerror=function(){finish(null);};
    document.body.appendChild(s);
  }

  function timeAgo(ts){
    var d=new Date(ts); if(isNaN(d.getTime()))return"";
    var s=Math.floor((Date.now()-d.getTime())/1000);
    if(s<60)return"à l'instant";
    var m=Math.floor(s/60); if(m<60)return"il y a "+m+" min";
    var h=Math.floor(m/60); if(h<24)return"il y a "+h+" h";
    var j=Math.floor(h/24); if(j<30)return"il y a "+j+" j";
    return"il y a "+Math.floor(j/30)+" mois";
  }

  // ── render + analytics fill ──
  var viewsData=null, statsByName=null;
  function fillViews(cards){
    document.querySelectorAll(".card").forEach(function(card){
      var c=cards[card.getAttribute("data-slug")]||{};
      var v=card.querySelector(".u-views"); if(v)v.textContent="👁 "+(c.views||0);
      var last=card.querySelector(".u-last"); if(last)last.textContent=c.last?"· "+timeAgo(c.last):"";
      var sub=card.querySelector(".uses-sub"); if(sub)sub.textContent="↗ "+(c.share||0)+"   ▦ "+(c.qr||0)+"   👤 "+(c.save||0);
    });
  }
  function fillStats(map){
    document.querySelectorAll(".card").forEach(function(card){
      var s=map[card.getAttribute("data-name")];
      var el=card.querySelector(".u-rate"); if(el)el.textContent=s?"· ★ "+s.avg.toFixed(1)+" ("+s.count+")":"";
    });
  }
  function applyCounters(){ if(viewsData)fillViews(viewsData); if(statsByName)fillStats(statsByName); }

  function render(list){
    g.innerHTML="";
    list.forEach(function(p){
      var a=document.createElement("a");
      a.href=p.slug+".html"; a.className="card";
      a.setAttribute("data-slug", p.slug);
      a.setAttribute("data-name", p.name);
      a.innerHTML='<div class="av">'+esc(p.av)+'</div>'+
        '<div class="cn">'+esc(p.name)+'</div>'+
        '<div class="cr">'+esc(p.role)+'</div>'+
        (p.city?'<span class="city">📍 '+esc(p.city)+'</span>':'')+
        '<div class="uses"><span class="u-views">👁 —</span><span class="u-rate"></span><span class="u-last"></span></div>'+
        '<div class="uses-sub"></div>';
      g.appendChild(a);
    });
    applyCounters();
  }

  render(people); // instant render from the hardcoded fallback

  // Live employee list (overrides the fallback if reachable).
  jsonp(ENDPOINT+"?action=employees", function(data){
    if(data && data.ok && data.employees && data.employees.length){
      render(data.employees.map(fromEmployee));
    }
  });
  // Per-card usage counters.
  jsonp(ENDPOINT+"?action=views", function(data){
    if(data && data.ok){ viewsData=data.cards||{}; fillViews(viewsData); }
  });
  // Ratings (matched by employee name).
  jsonp(ENDPOINT+"?action=stats", function(data){
    if(data && data.ok && data.stats){
      statsByName={}; data.stats.forEach(function(s){ statsByName[s.employee]={avg:s.avg,count:s.count}; });
      fillStats(statsByName);
    }
  });
</script>
  <!-- EC enhancements -->
  <script src="assets/qrcode.js"></script>
  <script src="assets/card.js"></script>
</body>
</html>
